[project]
name = "construction-cost-forecasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.15.0",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.0",
    "langfuse>=4.14.4",
    "langgraph>=1.2.11",
    "langgraph-prebuilt>=1.1.0",
    "litellm>=1.97.0",
    "matplotlib>=3.11.1",
    "mcp>=1.24.0,<2.0.0",
    "nest-asyncio>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pmdarima>=2.1.1",
    "prophet>=1.4.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "streamlit>=1.62.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.4",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


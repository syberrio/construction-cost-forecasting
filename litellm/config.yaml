model_list:
  - model_name: nvidia-nemotron-ultra-free
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 2000

  - model_name: nvidia-nemotron-super-free
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 2000

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  timeout: 30
  retry_after: 5

litellm_settings:
  fallbacks:
    - nvidia-nemotron-ultra-free:
        - nvidia-nemotron-super-free
  request_timeout: 30
  num_retries: 2
  drop_params: true

  # Observabilidad — envío automático a LangFuse
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

  # Tags para identificar la aplicación en LangFuse
  langfuse_default_tags:
    - "agent-cost-forecasting"
    - "construction-project"
    - "production"

  user_id_key: "user"

  # Credenciales LangFuse
  langfuse_public_key: os.environ/LANGFUSE_PUBLIC_KEY
  langfuse_secret_key: os.environ/LANGFUSE_SECRET_KEY
  langfuse_host: os.environ/LANGFUSE_HOST

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  default_team_params:
    metadata:
      application: "agent-cost-forecasting"
      version: "1.0.0"
      environment: "development"